server {
    listen 80;
    server_name localhost;

    # Placeholder for frontend static files
    location / {
        # In a future step, this will serve the frontend application
        # root /usr/share/nginx/html;
        # index index.html;
        # try_files $uri $uri/ /index.html;
        return 200 'GoTrade Frontend Placeholder';
        add_header Content-Type text/plain;
    }

    # API Gateway routing for User Service
    location /api/user/ {
        proxy_pass http://user-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Add other service locations here later
    # location /api/order/ { ... }
    # location /api/market/ { ... }
}
