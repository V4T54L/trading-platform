version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: gotrade_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - instrument-service
      - order-service
    networks:
      - gotrade-net

  user-service:
    build:
      context: ./user-service
    container_name: gotrade_user_service
    ports:
      - "8081:8081"
    environment:
      - APP_PORT=8081
      - POSTGRES_URL=postgres://gotrade:password@postgres:5432/gotrade_db?sslmode=disable
      - JWT_SECRET=a-very-secret-key-for-jwt-tokens
    depends_on:
      - postgres
    networks:
      - gotrade-net

  instrument-service:
    build:
      context: ./instrument-service
    ports:
      - "8082:8082"
    environment:
      - APP_PORT=8082
      - POSTGRES_URL=postgres://gotrade:password@postgres:5432/gotrade_db?sslmode=disable
    networks:
      - gotrade-net
    depends_on:
      - postgres

  instrument-seeder:
    build:
      context: ./instrument-service
      dockerfile: scripts/seed/Dockerfile
    environment:
      - POSTGRES_URL=postgres://gotrade:password@postgres:5432/gotrade_db?sslmode=disable
    networks:
      - gotrade-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  order-service:
    build:
      context: ./order-service
    ports:
      - "8083:8083"
    environment:
      - APP_PORT=8083
      - POSTGRES_URL=postgres://gotrade:password@postgres:5432/gotrade_db?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=a-very-secret-key-for-jwt-tokens
    networks:
      - gotrade-net
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14-alpine
    container_name: gotrade_postgres
    environment:
      - POSTGRES_USER=gotrade
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gotrade_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gotrade-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotrade -d gotrade_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gotrade_redis
    ports:
      - "6379:6379"
    networks:
      - gotrade-net

networks:
  gotrade-net:
    driver: bridge

volumes:
  postgres-data:

