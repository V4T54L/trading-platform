version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: gotrade_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - user-service
    networks:
      - gotrade-net

  user-service:
    build:
      context: ./user-service
    container_name: gotrade_user_service
    ports:
      - "8081:8081" # Expose for direct dev access if needed
    environment:
      - APP_PORT=8081
      - POSTGRES_URL=postgres://user:password@postgres:5432/gotrade_db?sslmode=disable
      - JWT_SECRET=your-super-secret-key
    depends_on:
      - postgres
    networks:
      - gotrade-net

  postgres:
    image: postgres:14-alpine
    container_name: gotrade_postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gotrade_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gotrade-net

  redis:
    image: redis:7-alpine
    container_name: gotrade_redis
    ports:
      - "6379:6379"
    networks:
      - gotrade-net

networks:
  gotrade-net:
    driver: bridge

volumes:
  postgres-data:

```
