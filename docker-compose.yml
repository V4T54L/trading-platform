services:
  nginx:
    image: nginx:1.25-alpine
    container_name: gotrade-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - gotrade-net
    depends_on:
      - user-service
      - instrument-service
      - order-service
      - account-service
      - websocket-gateway

  user-service:
    build:
      context: ./user-service
    container_name: gotrade-user-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - APP_PORT=8081
    networks:
      - gotrade-net
    depends_on:
      postgres:
        condition: service_healthy

  instrument-service:
    build:
      context: ./instrument-service
    container_name: gotrade-instrument-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - APP_PORT=8082
    networks:
      - gotrade-net
    depends_on:
      postgres:
        condition: service_healthy

  instrument-seeder:
    build:
      context: ./instrument-service
      dockerfile: scripts/seed/Dockerfile
    container_name: gotrade-instrument-seeder
    env_file:
      - .env
    networks:
      - gotrade-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  order-service:
    build:
      context: ./order-service
    container_name: gotrade-order-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - APP_PORT=8083
    networks:
      - gotrade-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  account-service:
    build:
      context: ./account-service
    container_name: gotrade-account-service
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - APP_PORT=8084
    networks:
      - gotrade-net
    depends_on:
      postgres:
        condition: service_healthy


  websocket-gateway:
    build:
      context: ./websocket-gateway
    container_name: gotrade-websocket-gateway
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - APP_PORT=8085
      - INSTRUMENT_SERVICE_URL=http://instrument-service:8082
    networks:
      - gotrade-net
    depends_on:
      - redis
      - instrument-service

  postgres:
    image: postgres:14-alpine
    container_name: gotrade-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gotrade-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gotrade-redis
    ports:
      - "6379:6379"
    networks:
      - gotrade-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  gotrade-net:
    driver: bridge

volumes:
  postgres-data:

